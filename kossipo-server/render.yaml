# Déploiement Render — KOSSIPO RESTAURANT PRO
services:
  - type: web
    name: kossipo-api
    runtime: node
    plan: starter
    region: frankfurt
    rootDir: server
    buildCommand: npm ci && npm run build && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: kossipo-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: BACKUP_DIR
        value: /var/data/backups
    disk:
      name: kossipo-backups
      mountPath: /var/data
      sizeGB: 1

databases:
  - name: kossipo-db
    databaseName: kossipo
    plan: basic-256mb
    region: frankfurt
